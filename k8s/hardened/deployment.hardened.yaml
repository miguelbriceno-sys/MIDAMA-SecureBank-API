apiVersion: apps/v1
kind: Deployment
metadata:
  name: securebank-api
  namespace: securebank
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: securebank-api}
  template:
    metadata:
      labels: {app: securebank-api}
    spec:
      serviceAccountName: securebank-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ghcr.io/miguelbriceno-sys/midama-securebank-api-lab@sha256:bc53427c67f3c20da8dbe46441ee156e04d83be8bb6c2138dcd90448c6db9f27
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: false
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          ports:
            - {name: http, containerPort: 3000}
          env:
            - name: PORT
              valueFrom: {configMapKeyRef: {name: securebank-config, key: PORT}}
            - name: DB_PATH
              valueFrom: {configMapKeyRef: {name: securebank-config, key: DB_PATH}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: securebank-runtime, key: jwt-key}}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 15}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: data, mountPath: /data}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
        - {name: data, emptyDir: {sizeLimit: 64Mi}}
