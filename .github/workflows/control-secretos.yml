name: Evidencia S07 - bloqueo de secreto de prueba
on:
  push:
    branches: [evidencia/s07-secreto]
permissions:
  contents: read
jobs:
  control-negativo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: scripts/ci/tool.sh gitleaks
      - name: Rechazar el marcador inerte
        run: scripts/ci/secret-control.sh evidencia/marcador.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: bloqueo-s07, path: evidencia/marcador.json}
