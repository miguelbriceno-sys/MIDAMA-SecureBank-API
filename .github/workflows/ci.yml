name: SecureBank CI
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - run: scripts/ci/tool.sh gitleaks
      - run: |
          mkdir -p evidence/secrets
          gitleaks git --no-banner --redact=100 --log-opts=--all --config=.gitleaks.toml --report-format=json --report-path=evidence/secrets/gitleaks.json .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: "secrets-${{ github.sha }}", path: evidence/secrets/, retention-days: 14, if-no-files-found: error}
  unit-tests:
    needs: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: "24"}
      - run: npm ci --ignore-scripts && npm run build
      - run: |
          set -o pipefail
          npm run test:ci | tee coverage-summary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tests-${{ github.sha }}
          path: |
            test-results.xml
            coverage-summary.txt
          retention-days: 14
          if-no-files-found: error
  sast:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: pipx install 'semgrep==1.145.0' --pip-args='-c security/python-constraints.txt'
      - run: ./scripts/sast.sh evidence/sast/sast-after.sarif
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: "sast-${{ github.sha }}", path: evidence/sast/, retention-days: 14, if-no-files-found: error}
  sca:
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: "24"}
      - run: python3 scripts/sca.py evidence/sca
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: "sca-${{ github.sha }}", path: evidence/sca/, retention-days: 14, if-no-files-found: error}
      - name: Retener hallazgos altos para revisión
        run: jq -e '.decision == "CONTINUAR"' evidence/sca/sca-decision.json
  dast:
    needs: sca
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - run: scripts/ci/dast.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: "dast-${{ github.sha }}", path: evidence/dast/, retention-days: 14, if-no-files-found: error}
  gate:
    needs: [secrets-scan, unit-tests, sast, sca, dast]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: "*-${{ github.sha }}", path: inputs}
      - run: scripts/ci/tool.sh opa
      - run: |
          opa test policy -v
          python3 scripts/ci/metrics.py inputs evidence/gate/metrics.json
          opa eval -f pretty -d policy/security-policy-v1.rego -i evidence/gate/metrics.json data.securepipeline.gate > evidence/gate/decision.json
          opa eval --fail -d policy/security-policy-v1.rego -i evidence/gate/metrics.json 'data.securepipeline.gate.allow == true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: "gate-${{ github.sha }}", path: evidence/gate/, retention-days: 14, if-no-files-found: error}
  build-test:
    needs: [unit-tests, sast, sca, dast, gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Exigir todas las etapas anteriores
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$RESULTS"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: "24"}
      - run: npm ci --ignore-scripts && npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
